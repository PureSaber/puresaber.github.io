<div class="catalog-search" id="catalog-search" role="search" hidden>
  <label for="catalog-query">{{ include.label }}</label>
  <div class="search-row">
    {% if include.home %}<svg class="home-search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.2 15.2 4.8 4.8"/></svg>{% endif %}
    <input id="catalog-query" type="search" placeholder="{% if include.home %}搜索工具、资源与组件{% else %}{% if page.catalog == 'components' %}搜索组件、生态或用途{% else %}例如 Git、Python、回测{% endif %}{% endif %}" autocomplete="off">
    <button id="clear-search" type="button" hidden>清除</button>
    {% if page.catalog == 'tools' %}
    <select id="tool-platform" aria-label="按电脑平台筛选" aria-controls="tools">
      <option value="">全部平台</option>
      <option value="Windows">Windows 可用</option>
      <option value="macOS">macOS 可用</option>
      <option value="Linux">Linux 可用</option>
      <option value="Web">Web 可用</option>
    </select>
    {% elsif page.catalog == 'components' %}
    <select id="component-kind" aria-label="按组件类型筛选" aria-controls="components"><option value="">全部类型</option></select>
    <select id="component-ecosystem" aria-label="按技术生态筛选" aria-controls="components"><option value="">全部生态</option></select>
    <select id="component-function" aria-label="按功能筛选" aria-controls="components"><option value="">全部功能</option></select>
    <select id="tool-platform" aria-label="按插件宿主筛选" aria-controls="components"><option value="">全部宿主</option></select>
    {% endif %}
  </div>
  <p class="search-status" id="search-status" role="status"></p>
</div>
