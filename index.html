---
layout: null
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="Kurage 的实用工具箱，收录开发与量化工具、编程学习资料和市场数据来源。">
  <title>我的实用工具箱 · Kurage</title>
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/site-toolbox-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/catalog.css' | relative_url }}?v=components-v1">
  <script defer src="{{ '/assets/home-search.js' | relative_url }}?v=components-v1"></script>
  <style>
    .home-shell {
      width: min(68rem, calc(100% - 3rem));
      margin-inline: auto;
    }
    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 4.25rem;
      border-bottom: 1px solid #d7dcd0;
    }
    .home-header a { color: #375146; text-decoration: none; }
    .home-header a:hover { text-decoration: underline; text-underline-offset: .24em; }
    .home-header .brand {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      color: #1c382e;
      font-size: 1.2rem;
      font-weight: 750;
      letter-spacing: -.035em;
    }
    .banner-home { padding-block: clamp(1.9rem, 5vw, 3.35rem) 3rem; }
    .banner-home h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.15;
      letter-spacing: -.055em;
    }
    .banner-home .catalog-search { margin-top: 1.25rem; }
    .banner-home .search-row { max-width: 31rem; }
    .home-nav { margin-top: 1.4rem; }
    .home-nav ul {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: .9rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .home-nav li { grid-column: span 3; min-width: 0; }
    .home-nav li.featured { grid-column: span 6; }
    .home-banner {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(3.2rem, 7.3vw, 5.4rem);
      align-items: center;
      gap: .55rem;
      min-height: 8.1rem;
      height: 100%;
      padding: 1rem clamp(.95rem, 2.2vw, 1.7rem);
      border: 1px solid var(--banner-line);
      border-radius: 1.05rem;
      background: linear-gradient(112deg, var(--banner-bg), var(--banner-edge));
      color: var(--banner-ink);
      overflow: hidden;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .home-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 .65rem 1.45rem #18322820;
    }
    .home-banner:focus-visible {
      outline: 2px solid #27644e;
      outline-offset: 4px;
    }
    .featured .home-banner {
      grid-template-columns: minmax(0, 1fr) clamp(6.4rem, 13.5vw, 10.2rem);
      min-height: 9.6rem;
    }
    .banner-copy { position: relative; z-index: 1; }
    .banner-copy strong {
      display: block;
      font-size: clamp(1.18rem, 2.3vw, 1.6rem);
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -.035em;
    }
    .featured .banner-copy strong {
      font-size: clamp(1.54rem, 3.35vw, 2.3rem);
      letter-spacing: -.045em;
    }
    .banner-copy small {
      display: block;
      margin-top: .45rem;
      color: var(--banner-muted);
      font-size: .9rem;
      line-height: 1.44;
      text-wrap: balance;
    }
    .banner-tools {
      --banner-bg: #263b46;
      --banner-edge: #1c2c36;
      --banner-ink: #fcfeff;
      --banner-muted: #d7e4eb;
      --banner-line: #354a53;
      --banner-ring: #ccedf72a;
    }
    .banner-mobile {
      --banner-bg: #254136;
      --banner-edge: #1b3228;
      --banner-ink: #fafffb;
      --banner-muted: #d9e9df;
      --banner-line: #345143;
      --banner-ring: #d9f5db2a;
    }
    .banner-plugins {
      --banner-bg: #eee9f5;
      --banner-edge: #e0d9ed;
      --banner-ink: #453759;
      --banner-muted: #625473;
      --banner-line: #dcd3e8;
      --banner-ring: #66508129;
    }
    @media (min-width: 44.01rem) and (max-width: 62rem) {
      .home-nav li:not(.featured) { grid-column: span 6; }
    }
    .banner-resources {
      --banner-bg: #ebf1e7;
      --banner-edge: #dce7da;
      --banner-ink: #223e32;
      --banner-muted: #40584b;
      --banner-line: #d2dfd2;
      --banner-ring: #4e6c532a;
    }
    .banner-learn {
      --banner-bg: #f7efe1;
      --banner-edge: #eee0c8;
      --banner-ink: #503824;
      --banner-muted: #66513b;
      --banner-line: #e9dcc6;
      --banner-ring: #82684432;
    }
    .banner-projects {
      --banner-bg: #edf1f5;
      --banner-edge: #dce6ee;
      --banner-ink: #253e51;
      --banner-muted: #435b6b;
      --banner-line: #d6e0e8;
      --banner-ring: #48617e29;
    }
    .banner-art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 3.15rem;
      pointer-events: none;
    }
    .banner-art::before,
    .banner-art::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 52%;
      width: 8.1rem;
      aspect-ratio: 1.38;
      border: 1px solid var(--banner-ring);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-10deg);
    }
    .banner-art::after { width: 11rem; opacity: .64; }
    .icon-stack::before { width: 11.5rem; }
    .icon-stack::after { width: 15.5rem; }
    .icon-stack {
      --tile-size: clamp(2.26rem, 5.4vw, 3.42rem);
      --tile-shift: clamp(1.4rem, 3.35vw, 2.48rem);
    }
    .icon-stack img {
      position: relative;
      grid-area: 1 / 1;
      width: var(--tile-size);
      height: var(--tile-size);
      padding: calc(var(--tile-size) * .125);
      object-fit: contain;
      background: linear-gradient(145deg, #fff, #f3f5ef);
      border: 1px solid #ffffffb0;
      border-radius: calc(var(--tile-size) * .25);
      box-shadow: 0 .35rem .85rem #0e221e58;
    }
    .icon-stack img:first-child { transform: translate(calc(-1 * var(--tile-shift)), .35rem) rotate(-13deg); }
    .icon-stack img:nth-child(2) {
      z-index: 1;
      transform: translateY(-.4rem) rotate(-4deg);
    }
    .icon-stack img:last-child { transform: translate(var(--tile-shift), .36rem) rotate(12deg); }
    .banner-icon-tile {
      display: grid;
      place-items: center;
      width: clamp(2.45rem, 5.1vw, 3.35rem);
      aspect-ratio: 1;
      border: 1px solid #ffffffd0;
      border-radius: .78rem;
      background: linear-gradient(145deg, #fffffff2, #ffffff96);
      box-shadow: .13rem .34rem .85rem #272f2420;
      transform: rotate(-9deg);
    }
    .banner-icon { width: 56%; height: 56%; color: var(--banner-ink); }
    @media (max-width: 44rem) {
      .home-shell { width: calc(100% - 2rem); }
      .home-header { min-height: 3.6rem; }
      .home-nav ul { grid-template-columns: minmax(0, 1fr); gap: .65rem; }
      .home-nav li, .home-nav li.featured { grid-column: auto; }
      .home-banner { min-height: 5.5rem; }
      .featured .home-banner { min-height: 6.35rem; }
      .banner-copy small { margin-top: .32rem; }
      .icon-stack { --tile-size: 2.65rem; --tile-shift: 1.65rem; }
      .icon-stack::before { width: 8.9rem; }
      .icon-stack::after { width: 11.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .home-banner { transition: none; }
      .home-banner:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="home-shell home-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-current="page">

  <main id="main" class="home-shell banner-home home-page"

            <span class="banner-copy"><strong>资源</strong><small>教程、市场数据和导航站</small></span>
            <span class="banner-art" aria-hidden="true">

          <a class="home-banner banner-learn" href="{{ '/learn/' | relative_url }}">

            <span class="banner-art" aria-hidden="true">
              <span class="banner-icon-tile"><svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18h8a3 3 0 0 0 0-6h-9a3 3 0 0 1 0-6h8"/></svg></span>
            </span>
          </a>
        </li>
        <li>
          <a class="home-banner banner-projects" href="{{ '/projects/' | relative_url }}">
            <span class="banner-copy"><strong>项目与服务</strong><small>我的开源项目和在线工具</small></span>
            <span class="banner-art" aria-hidden="true">
              <span class="banner-icon-tile"><svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 9 4.7-9 4.7-9-4.7Z"/><path d="m3 12.4 9 4.7 9-4.7M3 16.1l9 4.7 9-4.7"/></svg></span>

    </nav>
    <ul id="search-results" class="resources home-results" aria-label="搜索结果" hidden></ul>
  </main>
</body>
</html>
